name: Build Tasbih APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/tasbih/counter
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p gradle/wrapper

      - name: Write Kotlin files
        run: |
          cat > app/src/main/java/com/tasbih/counter/MainActivity.kt << 'KOTLINEOF'
          package com.tasbih.counter
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import androidx.appcompat.app.AppCompatActivity
          import com.tasbih.counter.databinding.ActivityMainBinding
          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private lateinit var prefs: SharedPreferences
              private var count = 0
              private var target = 33
              private var vibrationEnabled = true
              companion object {
                  const val PREFS_NAME = "TasbihPrefs"
                  const val KEY_COUNT = "count"
                  const val KEY_TARGET = "target"
                  const val KEY_VIBRATION = "vibration"
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  } else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  loadState()
                  updateUI()
                  setupListeners()
                  val serviceIntent = Intent(this, TasbihService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(serviceIntent)
                  else startService(serviceIntent)
              }
              private fun setupListeners() {
                  binding.btnCount.setOnClickListener { increment() }
                  binding.btnReset.setOnClickListener { count = 0; saveState(); updateUI() }
                  binding.btn33.setOnClickListener { setTarget(33) }
                  binding.btn99.setOnClickListener { setTarget(99) }
                  binding.btn100.setOnClickListener { setTarget(100) }
                  binding.btnVibration.setOnClickListener { vibrationEnabled = !vibrationEnabled; updateVibrationButton(); prefs.edit().putBoolean(KEY_VIBRATION, vibrationEnabled).apply() }
              }
              private fun increment() {
                  count++
                  vibrate()
                  saveState()
                  updateUI()
                  if (count % target == 0) onTargetReached()
              }
              private fun onTargetReached() {
                  binding.tvMilestone.visibility = View.VISIBLE
                  binding.tvMilestone.text = "مَاشَاءَاللَّٰه\nTarget Reached!"
                  vibrateLong()
                  binding.root.postDelayed({ binding.tvMilestone.visibility = View.GONE }, 3000)
              }
              private fun setTarget(t: Int) { target = t; prefs.edit().putInt(KEY_TARGET, t).apply(); updateUI() }
              private fun updateUI() {
                  binding.tvCount.text = count.toString()
                  binding.tvTarget.text = "/ $target"
                  val progress = ((count % target).toFloat() / target * 100).toInt()
                  binding.progressRing.progress = progress
                  val cycles = count / target
                  binding.tvCycles.text = if (cycles > 0) "× $cycles" else ""
                  updateVibrationButton()
              }
              private fun updateVibrationButton() {
                  binding.btnVibration.text = if (vibrationEnabled) "📳 ON" else "🔕 OFF"
              }
              private fun vibrate() {
                  if (!vibrationEnabled) return
                  val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  else @Suppress("DEPRECATION") getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) v.vibrate(VibrationEffect.createOneShot(30, VibrationEffect.DEFAULT_AMPLITUDE))
                  else @Suppress("DEPRECATION") v.vibrate(30)
              }
              private fun vibrateLong() {
                  if (!vibrationEnabled) return
                  val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  else @Suppress("DEPRECATION") getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) v.vibrate(VibrationEffect.createWaveform(longArrayOf(0,100,100,100,100,300), -1))
                  else @Suppress("DEPRECATION") v.vibrate(longArrayOf(0,100,100,100,100,300), -1)
              }
              private fun saveState() { prefs.edit().putInt(KEY_COUNT, count).putInt(KEY_TARGET, target).apply() }
              private fun loadState() { count = prefs.getInt(KEY_COUNT, 0); target = prefs.getInt(KEY_TARGET, 33); vibrationEnabled = prefs.getBoolean(KEY_VIBRATION, true) }
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  return when (event.keyCode) {
                      KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN -> { if (event.action == KeyEvent.ACTION_DOWN) increment(); true }
                      else -> super.dispatchKeyEvent(event)
                  }
              }
              override fun onResume() { super.onResume(); TasbihService.mainActivity = this }
              override fun onPause() { super.onPause(); TasbihService.mainActivity = null; saveState() }
          }
          KOTLINEOF

          cat > app/src/main/java/com/tasbih/counter/TasbihService.kt << 'KOTLINEOF'
          package com.tasbih.counter
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          class TasbihService : Service() {
              companion object {
                  const val CHANNEL_ID = "TasbihServiceChannel"
                  const val NOTIFICATION_ID = 1
                  var mainActivity: MainActivity? = null
              }
              override fun onCreate() { super.onCreate(); createNotificationChannel(); startForeground(NOTIFICATION_ID, buildNotification()) }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID).setContentTitle("Tasbih Active").setContentText("Volume buttons count • Tap to open").setSmallIcon(android.R.drawable.ic_menu_compass).setContentIntent(pi).setOngoing(true).setPriority(NotificationCompat.PRIORITY_LOW).setVisibility(NotificationCompat.VISIBILITY_PUBLIC).build()
              }
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "Tasbih Service", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
              }
          }
          KOTLINEOF

      - name: Write XML resources
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/bg_dark">
          <TextView android:id="@+id/tvBismillah" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم" android:textColor="@color/gold" android:textSize="20sp" android:layout_marginTop="32dp" app:layout_constraintTop_toTopOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
          <com.google.android.material.progressindicator.CircularProgressIndicator android:id="@+id/progressRing" android:layout_width="260dp" android:layout_height="260dp" android:layout_marginTop="24dp" app:trackThickness="8dp" app:indicatorColor="@color/green_primary" app:trackColor="@color/ring_track" app:indicatorSize="260dp" app:layout_constraintTop_toBottomOf="@id/tvBismillah" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
          <TextView android:id="@+id/tvCount" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="0" android:textColor="@color/text_primary" android:textSize="80sp" app:layout_constraintTop_toTopOf="@id/progressRing" app:layout_constraintBottom_toBottomOf="@id/progressRing" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent" app:layout_constraintVertical_bias="0.4"/>
          <TextView android:id="@+id/tvTarget" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="/ 33" android:textColor="@color/text_muted" android:textSize="18sp" app:layout_constraintTop_toBottomOf="@id/tvCount" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
          <TextView android:id="@+id/tvCycles" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="" android:textColor="@color/gold" android:textSize="14sp" app:layout_constraintTop_toBottomOf="@id/tvTarget" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
          <TextView android:id="@+id/tvMilestone" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="" android:textColor="@color/gold" android:textSize="20sp" android:gravity="center" android:visibility="gone" android:background="@drawable/milestone_bg" android:paddingHorizontal="20dp" android:paddingVertical="10dp" app:layout_constraintTop_toBottomOf="@id/progressRing" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent" android:layout_marginTop="8dp"/>
          <com.google.android.material.button.MaterialButton android:id="@+id/btnCount" android:layout_width="180dp" android:layout_height="180dp" android:text="COUNT" android:textSize="16sp" android:textColor="@color/text_primary" app:backgroundTint="@color/green_primary" app:cornerRadius="90dp" android:layout_marginTop="8dp" app:layout_constraintTop_toBottomOf="@id/progressRing" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent" app:layout_constraintBottom_toTopOf="@id/targetRow" app:layout_constraintVertical_bias="0.3"/>
          <LinearLayout android:id="@+id/targetRow" android:layout_width="0dp" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_marginHorizontal="16dp" android:layout_marginBottom="16dp" app:layout_constraintBottom_toTopOf="@id/bottomRow" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent">
          <com.google.android.material.button.MaterialButton android:id="@+id/btn33" style="@style/Widget.MaterialComponents.Button.OutlinedButton" android:layout_width="wrap_content" android:layout_height="40dp" android:text="33" android:textColor="@color/text_muted" app:strokeColor="@color/ring_track" android:layout_marginHorizontal="6dp"/>
          <com.google.android.material.button.MaterialButton android:id="@+id/btn99" style="@style/Widget.MaterialComponents.Button.OutlinedButton" android:layout_width="wrap_content" android:layout_height="40dp" android:text="99" android:textColor="@color/text_muted" app:strokeColor="@color/ring_track" android:layout_marginHorizontal="6dp"/>
          <com.google.android.material.button.MaterialButton android:id="@+id/btn100" style="@style/Widget.MaterialComponents.Button.OutlinedButton" android:layout_width="wrap_content" android:layout_height="40dp" android:text="100" android:textColor="@color/text_muted" app:strokeColor="@color/ring_track" android:layout_marginHorizontal="6dp"/>
          </LinearLayout>
          <LinearLayout android:id="@+id/bottomRow" android:layout_width="0dp" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_marginBottom="24dp" app:layout_constraintBottom_toBottomOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent">
          <com.google.android.material.button.MaterialButton android:id="@+id/btnReset" style="@style/Widget.MaterialComponents.Button.TextButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="↺ Reset" android:textColor="@color/text_muted" android:layout_marginEnd="24dp"/>
          <com.google.android.material.button.MaterialButton android:id="@+id/btnVibration" style="@style/Widget.MaterialComponents.Button.TextButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📳 ON" android:textColor="@color/text_muted"/>
          </LinearLayout>
          </androidx.constraintlayout.widget.ConstraintLayout>
          XMLEOF

          cat > app/src/main/res/values/colors.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          <color name="bg_dark">#0D1117</color>
          <color name="green_primary">#1A7A4A</color>
          <color name="gold">#C9A84C</color>
          <color name="text_primary">#F0F6FC</color>
          <color name="text_muted">#8B949E</color>
          <color name="ring_track">#21262D</color>
          <color name="purple_200">#1A7A4A</color>
          <color name="purple_500">#1A7A4A</color>
          <color name="purple_700">#145C38</color>
          <color name="teal_200">#2ECC80</color>
          <color name="teal_700">#1A7A4A</color>
          <color name="black">#FF000000</color>
          <color name="white">#FFFFFFFF</color>
          </resources>
          XMLEOF

          cat > app/src/main/res/values/strings.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Tasbih Counter</string></resources>
          XMLEOF

          cat > app/src/main/res/values/themes.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          <style name="Theme.TasbihCounter" parent="Theme.MaterialComponents.DayNight.NoActionBar">
          <item name="colorPrimary">@color/green_primary</item>
          <item name="colorPrimaryVariant">@color/green_primary</item>
          <item name="colorOnPrimary">@color/text_primary</item>
          <item name="colorSecondary">@color/gold</item>
          <item name="colorSecondaryVariant">@color/gold</item>
          <item name="colorOnSecondary">@color/black</item>
          <item name="android:statusBarColor">@color/bg_dark</item>
          <item name="android:navigationBarColor">@color/bg_dark</item>
          <item name="android:windowBackground">@color/bg_dark</item>
          </style>
          </resources>
          XMLEOF

          cat > app/src/main/res/drawable/milestone_bg.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
          <solid android:color="#1A1A0A"/>
          <stroke android:width="1dp" android:color="#C9A84C"/>
          <corners android:radius="12dp"/>
          </shape>
          XMLEOF

      - name: Write Manifest and Gradle files
        run: |
          cat > app/src/main/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.tasbih.counter">
          <uses-permission android:name="android.permission.VIBRATE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
          <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.TasbihCounter">
          <activity android:name=".MainActivity" android:exported="true" android:showOnLockScreen="true" android:turnScreenOn="true" android:screenOrientation="portrait">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          <service android:name=".TasbihService" android:exported="false" android:foregroundServiceType="specialUse">
          <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="volume key tasbih counter"/>
          </service>
          </application>
          </manifest>
          XMLEOF

          cat > app/build.gradle << 'GROOVYEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tasbih.counter'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tasbih.counter"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              buildFeatures { viewBinding true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          GROOVYEOF

          cat > build.gradle << 'GROOVYEOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          GROOVYEOF

          cat > settings.gradle << 'GROOVYEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TasbihCounter"
          include ':app'
          GROOVYEOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Generate launcher icons
        run: |
          python3 - << 'PYEOF'
          import struct, zlib, os
          def png(size):
              def chunk(n,d):
                  c=zlib.crc32(n+d)&0xffffffff
                  return struct.pack('>I',len(d))+n+d+struct.pack('>I',c)
              raw=b''
              for y in range(size):
                  raw+=b'\x00'
                  for x in range(size):
                      cx,cy=x-size//2,y-size//2
                      raw+=(b'\x1a\x6b\x3e\xff' if (cx*cx+cy*cy)**0.5<=size//2-1 else b'\x00\x00\x00\x00')
              p=b'\x89PNG\r\n\x1a\n'
              p+=chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))
              p+=chunk(b'IDAT',zlib.compress(raw))
              p+=chunk(b'IEND',b'')
              return p
          for d,s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              for n in ['ic_launcher','ic_launcher_round']:
                  with open(f'app/src/main/res/mipmap-{d}/{n}.png','wb') as f:
                      f.write(png(s))
          print('Icons done')
          PYEOF

      - name: Setup Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew" -o gradlew
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Counter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
